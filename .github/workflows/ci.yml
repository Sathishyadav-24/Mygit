name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The checker and tests use only the standard library; no pip install is needed.
      - name: Check Python syntax
        run: python3 -m compileall -q src tests

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
